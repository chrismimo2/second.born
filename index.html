let step=0,answers=Array(questions.length).fill(null),nickname='',generationTimer=null,currentMantra='';
function remember(){try{sessionStorage.setItem(storageKey,JSON.stringify({nickname,step,answers}))}catch(_){}}
function restore(){try{const data=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(!data||!Array.isArray(data.answers))return;nickname=typeof data.nickname==='string'?data.nickname.slice(0,32):'';answers=questions.map((q,i)=>Number.isInteger(data.answers[i])&&data.answers[i]>=0&&data.answers[i]<q.answers.length?data.answers[i]:null);step=Number.isInteger(data.step)&&data.step>=0&&data.step<questions.length?data.step:0}catch(_){}}
function show(name){screens.forEach(key=>$(key+'Screen').hidden=key!==name);window.scrollTo(0,0)}
function renderQuestion(){show('quiz');const question=questions[step];$('questionTitle').textContent=question.question;$('answers').replaceChildren();question.answers.forEach((text,index)=>{const label=document.createElement('label');label.className='answer'+(answers[step]===index?' is-selected':'');const input=document.createElement('input');input.type='radio';input.name='answer';input.value=String(index);input.checked=answers[step]===index;input.addEventListener('change',()=>{answers[step]=index;for(const option of $('answers').children)option.classList.toggle('is-selected',option.querySelector('input').checked);$('nextButton').disabled=false;remember()});const span=document.createElement('span');span.textContent=text;label.append(input,span);$('answers').append(label)});$('nextButton').disabled=answers[step]===null;$('progress').setAttribute('aria-valuenow',String(step+1));$('progress').setAttribute('aria-valuetext',`Ερώτηση ${step+1} από ${questions.length}`);$('progressLabel').textContent=`Ερώτηση ${step+1} από ${questions.length}`;$('progress').style.setProperty('--position',`${step/5*100}%`);document.querySelectorAll('.stop').forEach((stop,i)=>stop.classList.toggle('done',i<=step));$('questionTitle').focus({preventScroll:true});remember()}
// Offline preview: select one complete reviewed line, never concatenate answers.
// MASTER_PROMPT.md specifies the separate live AI generation brief.
function validateMantra(value){if(typeof value!=='string')throw new Error('Invalid mantra');const text=value.normalize('NFC').trim().replace(/\s+/gu,' '),words=text.split(' ');if(words.length<2||words.length>MAX_MANTRA_WORDS||words.some(word=>!/[\p{L}]/u.test(word))||/[\/\u2010-\u2015-]/u.test(text))throw new Error('Mantra must contain 2–5 words');return text}
function createMantra(selection){
 if(!Array.isArray(selection)||selection.length!==5||selection.some((value,i)=>!Number.isInteger(value)||!answerThemes[i][value]))throw new Error('Complete all five questions');
 const weights=[6,5,2,4,1],signature=selection.reduce((value,choice)=>value*5+choice,0);
 const ranked=mantraCatalog.map((entry,index)=>({entry,score:selection.reduce((sum,choice,i)=>sum+(answerThemes[i][choice].some(tag=>entry.tags.includes(tag))?weights[i]:0),0),tie:(signature*31+index*17)%97})).sort((a,b)=>b.score-a.score||b.tie-a.tie);
 return validateMantra(ranked[0].entry.text);
}
function renderResult(){currentMantra=createMantra(answers);$('resultTitle').textContent=`${nickname}, αυτός είναι ο ρυθμός σου.`;$('mantraText').textContent=currentMantra;$('status').textContent='';$('answerSummary').replaceChildren();questions.forEach((q,i)=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=q.question;dd.textContent=q.answers[answers[i]];$('answerSummary').append(dt,dd)});show('result');$('resultTitle').focus({preventScroll:true})}
function generate(){if(answers.some(a=>a===null))return;show('loading');clearTimeout(generationTimer);generationTimer=setTimeout(renderResult,1100)}
function clearNameError(){$('nickname').removeAttribute('aria-invalid');$('nameHint').classList.remove('error');$('nameHint').textContent='Το όνομά σου θα εμφανιστεί στο mantra.'}
for(const event of ['input','change'])$('nickname').addEventListener(event,()=>{nickname=$('nickname').value.trim().slice(0,32);if(nickname)clearNameError();remember()});
function beginGame(event){if(event)event.preventDefault();nickname=$('nickname').value.trim().slice(0,32);if(!nickname){$('nickname').setAttribute('aria-invalid','true');$('nameHint').classList.add('error');$('nameHint').textContent='Γράψε πρώτα το όνομα ή το nick σου για να ξεκινήσεις.';$('nickname').focus();return}clearNameError();renderQuestion()}
$('startButton').addEventListener('click',beginGame);
$('startForm').addEventListener('submit',beginGame);
$('nickname').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing)beginGame(event)});
$('nextButton').addEventListener('click',()=>{if(answers[step]===null)return;if(step<questions.length-1){step++;renderQuestion()}else generate()});
$('backButton').addEventListener('click',()=>{if(step>0){step--;renderQuestion()}else{show('welcome');$('nickname').focus()}});
$('editButton').addEventListener('click',()=>{step=0;renderQuestion()});
$('restartButton').addEventListener('click',()=>{clearTimeout(generationTimer);step=0;answers=Array(questions.length).fill(null);nickname='';$('nickname').value='';clearNameError();remember();show('welcome');$('nickname').focus()});
$('copyButton').addEventListener('click',async()=>{const text=validateMantra(currentMantra);try{await navigator.clipboard.writeText(text);$('status').textContent='Το mantra σου αντιγράφηκε!'}catch(_){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();$('status').textContent=copied?'Το mantra σου αντιγράφηκε!':'Επίλεξε το κείμενο του mantra για να το αντιγράψεις.'}});
function xml(text){return text.replace(/[<>&"']/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[ch]))}
$('downloadButton').addEventListener('click',()=>{const text=validateMantra(currentMantra),context=document.createElement('canvas').getContext('2d');context.font='italic 900 100px Arial';const size=Math.min(102,Math.floor(1060/context.measureText(text).width*100));const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><title>${xml(text)}</title><text x="600" y="530" fill="#e20074" font-family="Arial, sans-serif" font-size="${size}" font-weight="900" font-style="italic" text-anchor="middle">${xml(text)}</text></svg>`;const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='my-running-mantra.svg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='Το mantra σου αποθηκεύτηκε με διάφανο φόντο.'});
restore();$('nickname').value=nickname;
})();
</script>
</body>
</html>
